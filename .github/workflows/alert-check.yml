name: Frequent alert check

# Runs independently of Vercel Cron (Hobby plan caps that at once/day) and independently of
# anyone visiting the Control Center — this is what makes breach/dormant-bot alerts fire
# 24/7. Hits the same daily-cron endpoint with ?mode=alerts, which does the sync + threshold
# checks but deliberately skips the daily/weekly/monthly report sends (those stay 1x/day,
# driven only by the real Vercel Cron). GitHub's own scheduler isn't exact either — expect
# some jitter, same caveat as Vercel's.
#
# 5 minutes is GitHub Actions' hard floor for scheduled workflows (it won't run any more
# often than that no matter what's written here) — it's also already well past this repo's
# free monthly Actions-minutes quota at this cadence on a private repo, so don't tighten this
# further without switching the trigger to a dedicated external cron service instead.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger alert check
        run: |
          # The body was discarded, which made every silent no-op invisible: a missing env
          # var read exactly like a healthy run. Print the per-channel outcomes instead —
          # they carry no secrets, only what each channel did.
          # --max-time, and a job timeout below: an endpoint that HANGS otherwise holds this
          # runner until the next scheduled run cancels it — which is what "All jobs were
          # cancelled" means. Failing in 90s says something useful; being cancelled says
          # nothing at all.
          body=$(curl -sf --max-time 90 -X POST "https://cc.lno.company/api/cron/daily?mode=alerts" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -w "\nstatus=%{http_code} duration=%{time_total}s")
          echo "$body"
